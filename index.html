<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vr Explore</title>
    <link rel="stylesheet" href="assets/pagina__princiapl/css/pt.css">
    <link rel="stylesheet" href="assets/paginas_menu/css/rep/footer.css">
    <link rel="stylesheet" href="assets/paginas_menu/css/rep/menu_overlay.css">
    <link rel="stylesheet" href="assets/paginas_menu/css/responsividade/menu_overlay_responsivo.css">
    <link rel="stylesheet" href="assets/sistema_de_login/css/auth-nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>
  </head>
<body>

    <!-- HEADER -->
    <header>
        <nav-bar>
            <div class="nav-left">
                <ul>
                    <li>
                        <a href="./index.html">
                            <h1>Vr<p class="sub-title">Explore</p></h1>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="nav-center">
                <img src="assets/pagina__princiapl/img/Group51(1).png" alt="logo" class="logo">
            </div>
            <div class="nav-right">
                <a class="auth-nav-link" data-auth-nav href="assets/sistema_de_login/html/login.html" aria-label="Fazer login">
                    <span class="auth-nav-login">Login</span>
                    <span class="auth-nav-account" aria-hidden="true">
                        <svg viewBox="0 0 24 24" role="img">
                            <circle cx="12" cy="8" r="5"></circle>
                            <path d="M4 21a8 8 0 0 1 16 0"></path>
                        </svg>
                    </span>
                </a>
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
            </div>
        </nav-bar>
    </header>

    <!-- MENU OVERLAY -->
     <div
        id="menu-overlay"
        class="menu-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="Menu principal"
        aria-hidden="true"
    >
        <canvas id="wc" class="menu-canvas"></canvas>
        <div class="menu-overlay-content">
            <div class="menu-header">
                <a href="./index.html"><h1>Vr<p class="sub-title">Explore</p></h1></a>
                <button class="close-btn" type="button" onclick="toggleMenu()" aria-label="Fechar menu">&#x2715;</button>
            </div>

            <div class="menu-body">
                <div class="menu-cards-section">
                    <div class="menu-card-column menu-card-column--left" data-card-column="left">
                        <article class="menu-card menu-card--home" data-card="home">
                        
                            <div class="menu-card-media" aria-hidden="true">
                                <img
                                    class="menu-card-image menu-card-image--home"
                                    src="assets/paginas_menu/img/mauricio_menu.png"
                                    alt=""
                                    loading="eager"
                                >
                            </div>
                        </article>

                        <article class="menu-card menu-card--explore" data-card="explore">
                            <div class="menu-card-copy">
                               
                            </div>
                            <div class="menu-card-media menu-card-media--model">
                                <!-- Modelo 3D do Meta Quest 3 -->
                                <model-viewer
                                    class="menu-card-model"
                                    src="assets/paginas_menu/models/source/Quest3.glb"
                                    alt="Modelo 3D dos óculos Meta Quest 3"
                                    loading="eager"
                                    auto-rotate
                                    auto-rotate-delay="0"
                                    rotation-per-second="18deg"
                                    camera-controls
                                    disable-zoom
                                    interaction-prompt="none"
                                    shadow-intensity="0.7"
                                    environment-image="neutral"
                                >
                                    <div class="menu-model-poster" slot="poster" aria-hidden="true">
                                        <span>MODELO 3D</span>
                                        <small>Quest3.glb</small>
                                    </div>
                                </model-viewer>
                            </div>
                        </article>
                    </div>
                    <div class="menu-card-column menu-card-column--right" data-card-column="right">
                        <article class="menu-card menu-card--tecnologias" data-card="tecnologias">
                       
                            <div class="menu-card-media" aria-hidden="true">
                                <img
                                    class="menu-card-image menu-card-image--tecnologias"
                                    src="assets/paginas_menu/img/mulhervr_menu.png"
                                    alt=""
                                    loading="eager"
                                >
                            </div>
                        </article>

                        <article class="menu-card menu-card--interacoes" data-card="interacoes">
                            <div class="menu-card-copy">              
                            </div>
                            <div class="menu-card-media menu-card-media--model">
                                <!-- Troque apenas o src abaixo pelo caminho do controle de PS5 .glb -->
                                <model-viewer
                                    class="menu-card-model menu-card-model--controller"
                                    src="assets/paginas_menu/models/source/ps5_controller.glb"
                                    alt="Modelo 3D de um controle de PS5"
                                    loading="eager"
                                    auto-rotate
                                    auto-rotate-delay="0"
                                    rotation-per-second="22deg"
                                    camera-controls
                                    disable-zoom
                                    interaction-prompt="none"
                                    shadow-intensity="0.8"
                                    environment-image="neutral"
                                    camera-orbit="25deg 72deg auto"
                                >
                                    <div class="menu-model-poster" slot="poster" aria-hidden="true">
                                        <span>MODELO 3D</span>
                                        <small>controle-ps5.glb</small>
                                    </div>
                                </model-viewer>
                            </div>
                        </article>
                    </div>
                </div>

                <nav class="menu-nav">
                    <a href="./index.html" class="menu-nav-item" data-menu-target="home">
                        <span class="text-wrapper">
                            <span class="text top">HOME</span>
                            <span class="text bottom">HOME</span>
                        </span>
                    </a>
                    <a href="assets/paginas_menu/html/tecnologias.html" class="menu-nav-item" data-menu-target="tecnologias">
                        <span class="text-wrapper">
                            <span class="text top">TECNOLOGIAS</span>
                            <span class="text bottom">TECNOLOGIAS</span>
                        </span>
                    </a>
                    <a href="assets/paginas_menu/html/explore.html" class="menu-nav-item" data-menu-target="explore">
                        <span class="text-wrapper">
                            <span class="text top">EXPLORE</span>
                            <span class="text bottom">EXPLORE</span>
                        </span>
                    </a>
                    <a href="assets/paginas_menu/html/interaçoes.html" class="menu-nav-item" data-menu-target="interacoes">
                        <span class="text-wrapper">
                            <span class="text top">INTERAÇOES</span>
                            <span class="text bottom">INTERAÇOES</span>
                        </span>
                    </a>
                    <img src="assets/pagina__princiapl/img/Group 51 (2).png" alt="logo" class="section-logo">
                </nav>
            </div>
        </div>
    </div>


    <!-- HERO - efeito máscara -->
    <main class="main-content">
        <section class="hero-section">
            <canvas id="hero-canvas"></canvas>
        </section>
    </main>

    <!-- FOOTER COMPARTILHADO -->
    <footer class="footer">
        <div class="footer-inner">
            <a class="footer-brand" href="./index.html" aria-label="VR Explore — página inicial">
                <img src="assets/paginas_menu/img/Group 51 (2).png" alt="" aria-hidden="true">
                <span class="footer-brand-text">VR <span>Explore</span></span>
            </a>

            <p class="footer-rights">&copy; 2026 VR Explore. Todos os direitos reservados.</p>

            <nav class="footer-nav" aria-label="Navegação do rodapé">
                <a href="./index.html" aria-current="page">Home</a>
                <a href="assets/paginas_menu/html/tecnologias.html">Tecnologias</a>
                <a href="assets/paginas_menu/html/explore.html">Explore</a>
                <a href="assets/paginas_menu/html/interaçoes.html">Interações</a>
            </nav>
        </div>
    </footer>

    <!-- Three.js local — sem dependencia de CDN externo -->
    <script src="assets/pagina__princiapl/js/three.min.js"></script>

    <!-- Scripts do projeto -->
    <script src="assets/pagina__princiapl/js/pt.js"></script>
    <script src="assets/pagina__princiapl/js/back_menu.js"></script>
    <script src="assets/paginas_menu/js/Card.js"></script>
    <script src="assets/pagina__princiapl/js/hero_mask.js"></script>
    <script type="module" src="assets/sistema_de_login/js/auth-nav.js"></script>
</body>
</html>
